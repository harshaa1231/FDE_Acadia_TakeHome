services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides on top of backend/.env: these two need container-specific
      # values (the volume mount path; the frontend's container-network
      # origin) regardless of what's set for local, non-Docker runs.
      - DATA_DIR=/data
      - CORS_ALLOW_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
