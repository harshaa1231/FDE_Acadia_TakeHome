<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1085" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d00"/>
    </marker>
  </defs>

  <rect width="1500" height="1085" fill="#fbfbfa"/>

  <!-- Title -->
  <text x="30" y="38" font-size="22" font-weight="700" fill="#1a1a1a">Natural Language Insights Engine — Architecture</text>
  <text x="30" y="60" font-size="13" fill="#666">Client → API → async job queue → ingestion pipeline / query pipeline → stores. LLM calls (dashed) are provider-agnostic (Groq).</text>

  <!-- Legend -->
  <g font-size="11" fill="#444">
    <rect x="1130" y="20" width="14" height="14" fill="#e8f0fe" stroke="#3855b3"/>
    <text x="1150" y="31">code / component</text>
    <rect x="1130" y="40" width="14" height="14" fill="#fdf3e0" stroke="#b3821a"/>
    <text x="1150" y="51">persistent store</text>
    <line x1="1130" y1="65" x2="1144" y2="65" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="1150" y="69">LLM call</text>
  </g>

  <!-- Client -->
  <rect x="600" y="80" width="300" height="50" rx="6" fill="#eef1fb" stroke="#3855b3" stroke-width="1.5"/>
  <text x="750" y="102" text-align="middle" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a">Client (React UI / curl)</text>
  <text x="750" y="119" font-size="11" text-anchor="middle" fill="#555">Upload CSV, ask a question, poll job status</text>

  <line x1="750" y1="130" x2="750" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API layer -->
  <rect x="450" y="162" width="600" height="70" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="750" y="186" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a">FastAPI Service — POST /datasets · POST /datasets/{id}/questions · GET /jobs/{id}[/result|/trace]</text>
  <text x="750" y="205" font-size="11" text-anchor="middle" fill="#555">Owns: request validation, structured error envelope, status codes — never a raw stack trace</text>
  <text x="750" y="221" font-size="11" text-anchor="middle" fill="#555">Every mutating call returns 202 + job_id immediately — never blocks on ingestion or a question</text>

  <line x1="750" y1="232" x2="750" y2="262" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Job Queue -->
  <rect x="400" y="264" width="700" height="66" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="750" y="288" font-size="14" font-weight="600" text-anchor="middle" fill="#1a1a1a">Job Queue — bounded asyncio worker pool (JobStatus: queued → running → succeeded/failed)</text>
  <text x="750" y="306" font-size="11" text-anchor="middle" fill="#555">Owns: concurrency limit, backpressure (queue-full → 429), one failed job never blocks another</text>
  <text x="750" y="321" font-size="11" text-anchor="middle" fill="#555">Persists every status transition to SQLite before/after each handler runs</text>

  <!-- split arrows -->
  <line x1="600" y1="330" x2="330" y2="368" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="330" x2="1170" y2="368" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="352" font-size="12" font-weight="600" fill="#3855b3">ingest job</text>
  <text x="1040" y="352" font-size="12" font-weight="600" fill="#3855b3">question job</text>

  <!-- INGEST PIPELINE (left column) -->
  <text x="60" y="365" font-size="13" font-weight="700" fill="#1a1a1a">Ingestion pipeline</text>

  <rect x="60" y="372" width="500" height="56" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="310" y="394" font-size="13" font-weight="600" text-anchor="middle">csv_loader — DuckDB read_csv_auto()</text>
  <text x="310" y="411" font-size="10.5" text-anchor="middle" fill="#555">Sniffs delimiter/header/types from the file itself. On failure: rolls back, no partial dataset left queryable</text>
  <line x1="310" y1="428" x2="310" y2="450" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="452" width="500" height="56" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="310" y="474" font-size="13" font-weight="600" text-anchor="middle">schema_profiler — purely descriptive stats</text>
  <text x="310" y="491" font-size="10.5" text-anchor="middle" fill="#555">Type, null %, distinct count, uniqueness, min/max, samples — no business meaning yet</text>
  <line x1="310" y1="508" x2="310" y2="530" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="532" width="500" height="66" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="310" y="554" font-size="13" font-weight="600" text-anchor="middle">concept_mapper — semantic layer</text>
  <text x="310" y="571" font-size="10.5" text-anchor="middle" fill="#555">LLM proposes structural roles from real column stats + samples;</text>
  <text x="310" y="585" font-size="10.5" text-anchor="middle" fill="#555">code deterministically validates every proposal before trusting it</text>
  <line x1="565" y1="565" x2="620" y2="565" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>

  <line x1="310" y1="598" x2="310" y2="620" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="622" width="500" height="56" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="310" y="644" font-size="13" font-weight="600" text-anchor="middle">metric_registry — named metrics over resolved roles</text>
  <text x="310" y="661" font-size="10.5" text-anchor="middle" fill="#555">net_revenue, order_count, unique_customers... the extensibility hook</text>
  <line x1="310" y1="678" x2="310" y2="700" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- QUERY PIPELINE (right column) -->
  <text x="960" y="365" font-size="13" font-weight="700" fill="#1a1a1a">Query pipeline</text>

  <rect x="960" y="372" width="500" height="50" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="1210" y="392" font-size="13" font-weight="600" text-anchor="middle">answerability_gate</text>
  <text x="1210" y="409" font-size="10.5" text-anchor="middle" fill="#555">Structural pre-check only — refuses instantly if the dataset has no usable grain/measure at all</text>
  <line x1="1210" y1="422" x2="1210" y2="444" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="960" y="446" width="500" height="50" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="1210" y="466" font-size="13" font-weight="600" text-anchor="middle">prompt_builder</text>
  <text x="1210" y="483" font-size="10.5" text-anchor="middle" fill="#555">Assembles roles + metrics + dimensions + sample rows — never raw column guesses</text>
  <line x1="1210" y1="496" x2="1210" y2="518" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="960" y="520" width="500" height="50" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="1210" y="540" font-size="13" font-weight="600" text-anchor="middle">SQL generation (LLM)</text>
  <text x="1210" y="557" font-size="10.5" text-anchor="middle" fill="#555">Emits SELECT SQL, `REFUSE: reason`, or `OVERVIEW`</text>
  <line x1="955" y1="545" x2="900" y2="545" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <line x1="1210" y1="570" x2="1210" y2="592" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="960" y="594" width="500" height="50" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="1210" y="614" font-size="13" font-weight="600" text-anchor="middle">sql_guardrails</text>
  <text x="1210" y="631" font-size="10.5" text-anchor="middle" fill="#555">Single SELECT (CTEs/window fns OK), known tables/columns only, LIMIT capped</text>
  <line x1="1210" y1="644" x2="1210" y2="666" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="960" y="668" width="500" height="50" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="1210" y="688" font-size="13" font-weight="600" text-anchor="middle">DuckDB execution (timeout + 1 retry)</text>
  <text x="1210" y="705" font-size="10.5" text-anchor="middle" fill="#555">On failure, error is fed back to the LLM once before refusing</text>
  <line x1="1210" y1="718" x2="1210" y2="740" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="960" y="742" width="500" height="50" rx="6" fill="#e8f0fe" stroke="#3855b3" stroke-width="1.5"/>
  <text x="1210" y="762" font-size="13" font-weight="600" text-anchor="middle">answer_synth (LLM)</text>
  <text x="1210" y="779" font-size="10.5" text-anchor="middle" fill="#555">Phrases only numbers present in the executed result — never adds outside facts</text>
  <line x1="955" y1="767" x2="900" y2="767" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>

  <!-- Groq LLM external box -->
  <rect x="780" y="500" width="120" height="90" rx="6" fill="#fdf3e0" stroke="#b3821a" stroke-width="1.5"/>
  <text x="840" y="530" font-size="12" font-weight="600" text-anchor="middle">Groq LLM API</text>
  <text x="840" y="548" font-size="10" text-anchor="middle" fill="#666">fast_model:</text>
  <text x="840" y="561" font-size="10" text-anchor="middle" fill="#666">concept map,</text>
  <text x="840" y="574" font-size="10" text-anchor="middle" fill="#666">answer synth</text>
  <line x1="840" y1="500" x2="840" y2="598" stroke="none"/>

  <!-- connect concept_mapper dashed line properly (redraw more precise) -->
  <line x1="560" y1="565" x2="780" y2="540" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="960" y1="545" x2="900" y2="545" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="960" y1="767" x2="840" y2="590" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Trace store, spans under query pipeline -->
  <line x1="1210" y1="792" x2="1210" y2="814" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stores row -->
  <rect x="60" y="700" width="500" height="50" rx="6" fill="#fdf3e0" stroke="#b3821a" stroke-width="1.5"/>
  <text x="310" y="722" font-size="13" font-weight="600" text-anchor="middle">dataset_store (SQLite)</text>
  <text x="310" y="739" font-size="10.5" text-anchor="middle" fill="#555">Persists schema profile + concept map per dataset_id — reused by every later question</text>

  <line x1="310" y1="750" x2="310" y2="772" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="772" x2="960" y2="392" stroke="#444" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arrow)"/>
  <text x="600" y="750" font-size="10.5" fill="#555" transform="rotate(-16 600 750)">loaded at question time</text>

  <rect x="60" y="774" width="500" height="46" rx="6" fill="#fdf3e0" stroke="#b3821a" stroke-width="1.5"/>
  <text x="310" y="802" font-size="12" text-anchor="middle" fill="#333">per-dataset DuckDB file — the actual queryable data</text>

  <rect x="960" y="816" width="500" height="56" rx="6" fill="#fdf3e0" stroke="#b3821a" stroke-width="1.5"/>
  <text x="1210" y="838" font-size="13" font-weight="600" text-anchor="middle">trace_store (SQLite) — LLM observability</text>
  <text x="1210" y="855" font-size="10.5" text-anchor="middle" fill="#555">Every stage (prompt, guardrail verdict, SQL, result, token usage) → GET /jobs/{id}/trace</text>

  <!-- job store -->
  <rect x="450" y="890" width="600" height="50" rx="6" fill="#fdf3e0" stroke="#b3821a" stroke-width="1.5"/>
  <text x="750" y="912" font-size="13" font-weight="600" text-anchor="middle">job_store (SQLite)</text>
  <text x="750" y="928" font-size="10.5" text-anchor="middle" fill="#555">Job status/result, read by GET /jobs/{id} and GET /jobs/{id}/result</text>

  <line x1="310" y1="820" x2="620" y2="895" stroke="#444" stroke-width="1.2" stroke-dasharray="2,3"/>
  <line x1="1210" y1="872" x2="900" y2="895" stroke="#444" stroke-width="1.2" stroke-dasharray="2,3"/>

  <!-- Response contract -->
  <line x1="750" y1="890" x2="750" y2="960" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="962" width="500" height="50" rx="6" fill="#eef1fb" stroke="#3855b3" stroke-width="1.5"/>
  <text x="750" y="984" font-size="13" font-weight="600" text-anchor="middle">Response: GET /jobs/{id} (status) → GET /jobs/{id}/result</text>
  <text x="750" y="1000" font-size="10.5" text-anchor="middle" fill="#555">Answer + generated SQL + result rows returned together, so the answer is independently verifiable</text>

  <!-- footer note -->
  <text x="30" y="1050" font-size="11.5" fill="#666">Nothing in the query pipeline references a hardcoded column name. Every SQL reference traces back to a role/metric/dimension</text>
  <text x="30" y="1066" font-size="11.5" fill="#666">resolved from THIS file's own profile at ingest time — which is what makes an unseen CSV a mechanical re-run, not new code.</text>
</svg>
